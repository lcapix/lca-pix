# AWS Amplify Hosting build spec for the LCAPIX Next.js (SSR) app.
# Amplify runs its own Next.js adapter, so no standalone output is needed here.
# Set env vars in the Amplify console (App settings → Environment variables):
#   DATABASE_HOST DATABASE_PORT DATABASE_NAME DATABASE_USER DATABASE_PASSWORD
#   JWT_SECRET NEXT_PUBLIC_APP_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
#   (+ optional integration API keys once you have them)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
