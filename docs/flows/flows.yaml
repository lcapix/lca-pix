            matrix: R10
            roles_allowed: [adminm, owner]
            roles_denied: [anon, nonmem, viewer, editor, padmin]
          - method: PUT
            path: '/api/cases/{caseId}'
            body: {reference_flow: 1, reference_flow_unit: mug, modeled_output: 1}
            matrix: R20
            roles_allowed: [editor, adminm, owner]
            roles_denied: [anon, nonmem, viewer, padmin]
        db: {write: [project, case_table, component]}
        expects:
          status: [200, 200]
          db_after: 'project goal fields saved; case reference_flow and modeled_output saved; root product component.quantity = modeled_output'
          ui: 'card collapses; summary shows the FU'
        failures:
          - {when: 'caller is editor', expect: 'project PUT 403, case PUT 200 (partial save); UI message says "Only the project owner…"', note: 'decide whether editors may set the FU'}
          - {when: 'reference_flow or modeled_output <= 0', status: 400, ui: 'client "Reference flow and data basis must be numbers above 0."'}
          - {when: 'system_boundary not one of the three', status: 400}
          - {when: 'migration 014 missing', status: 409}
        known_bugs: [EDIT-8, GS-2]
      - id: F5.4
        route: /project/{id}/case/{caseId}
        action: 'observe button "Run Assessment"'
        api:
          - {method: GET, path: '/api/cases/{caseId}/completeness', matrix: R25, roles_allowed: [viewer, editor, adminm, owner], roles_denied: [anon, nonmem, padmin]}
        db: {read: [component, flows, substances]}
        expects:
          ui: 'enabled only when FU set AND completeness.present includes materials|energy|emissions|transport; otherwise title "Set the functional unit (Goal & scope) before running" or "Add at least one input or emission before running"'
        notes: 'gate is UI-only; POST /api/cases/{id}/assessments accepts a case without FU'

  - id: F6
    title: Build the process tree (5 tiers)
    actor: editor
    e2e: true
    preconditions: ['$P.empty case with no components']
    steps:
      - id: F6.1
        route: /project/{id}/case/{caseId}
        action: page load
        api:
          - {method: GET, path: '/api/cases/{caseId}', matrix: R19}
          - {method: GET, path: '/api/cases/{caseId}/components', matrix: R26, roles_allowed: [viewer, editor, adminm, owner], roles_denied: [anon, nonmem, padmin]}
          - {method: GET, path: '/api/cases/{caseId}/completeness', matrix: R25}
          - {method: GET, path: '/api/cases/{caseId}/assessments', matrix: R22, roles_allowed: [viewer, editor, adminm, owner], roles_denied: [anon, nonmem, padmin]}
          - {method: GET, path: '/api/projects/{projectId}', matrix: R09}
          - {method: GET, path: '/api/projects/{projectId}/cases', matrix: R12}
        db: {read: [case_table, component, flows, substances, assessment_runs, project]}
        expects: {status: 200, ui: 'canvas "No components in this case yet." + button "Create your first component"; view switch Tree / List / Plot (target label Graph)'}
      - id: F6.3
        route: '/project/{id}/case/{caseId}/component/new (modal "New component")'
        action: 'for each tier: choose radio in radiogroup "Component type", choose "Parent component", fill Name, Quantity, Unit; click "Create component"'
        api:
          - method: POST
            path: '/api/cases/{caseId}/components'
            repeat:
              - {component_name: 'Ceramic Coffee Mug (350ml)', component_type: product, quantity: 1, unit: unit}
              - {component_name: 'Forming Line', component_type: machine_line, parent_component_id: '$prev'}
              - {component_name: 'Slip Casting', component_type: subprocess, parent_component_id: '$prev'}
              - {component_name: 'Mold Filling', component_type: operation, parent_component_id: '$prev'}
              - {component_name: 'Mold Cleaning', component_type: elemental_task, parent_component_id: '$prev'}
            matrix: R27
            roles_allowed: [editor, adminm, owner]
            roles_denied: [anon, nonmem, viewer, padmin]
        db: {write: [component]}
        expects:
          status: 201
          db_after: 'five rows, each parent in the same case, hierarchy_level 1..5'
          ui: 'node appears in sidebar, canvas and List view (editor remounts on lcapix:components-changed)'
        failures:
          - {when: 'component_type not in the five', status: 400}
          - {when: 'name or type missing', status: 400}
          - {when: 'parent_component_id belongs to $Q.case', status: 400, now: 201, bug: M1, fixed_by: 'fix-first 1.5'}
          - {when: 'caller is viewer', status: 403}
        known_bugs: [FLOW-1, M1, EDIT-6]
      - id: F6.4
        route: /project/{id}/case/{caseId}
        action: 'select "Mold Cleaning"; set Life-cycle stage "Production"; change Placement -> Parent to "Slip Casting"; click "Save"'
        api:
          - method: PUT
            path: '/api/components/{componentId}'
            params: {componentId: $P.base.task}
            body: {component_name: 'Mold Cleaning', component_type: elemental_task, parent_component_id: $P.base.subprocess, life_cycle_stage: production}
            matrix: R34
            roles_allowed: [editor, adminm, owner]
            roles_denied: [anon, nonmem, viewer, padmin]
          - {method: GET, path: '/api/cases/{caseId}/components', matrix: R26}
        db: {write: [component]}
        expects:
          status: 200
          db_after: 'life_cycle_stage=production; parent_component_id updated; hierarchy_level = new depth'
          ui: 'after reload the stage select shows the saved stage'
          now: 'life_cycle_stage never sent (EDIT-2); hierarchy_level not updated (EDIT-9)'
        failures:
          - {when: 'parent is self or a descendant', status: 400, now: 200, bug: FLOW-1}
          - {when: 'parent in another case/tenant', status: 400, now: '200 + other tenant name echoed', bug: M1}
          - {when: 'clear description/unit to null', expect: 'stored NULL', now: 'old value kept', bug: FLOW-3}
        known_bugs: [EDIT-2, EDIT-5, EDIT-9, FLOW-3]
      - id: F6.6
        route: /project/{id}/case/{caseId}
        action: 'select a node with children; click inspector "Delete"; choose "Delete subtree" (today: confirm OK twice) or "Keep children (move up)"'
        api:
          - method: DELETE
            path: '/api/components/{componentId}'
            params: {componentId: $P.base.subprocess}
            matrix: R35
            roles_allowed: [adminm, owner]
            roles_denied: [anon, nonmem, viewer, padmin]
            decision: 'D5 — editor allowed? (REC FLOW-10)'
          - method: PUT
            path: '/api/components/{childId}'
            when: keep children
            body: {parent_component_id: '<grandparent id or null>'}
            matrix: R34
        db: {write: [component, flows, assessment_results]}
        expects:
          status: 200
          db_after: 'subtree rows gone (or children re-parented); historical run totals unchanged (RUN-1)'
          ui: 'node gone after reload'
          now: 'no request sent; only the Zustand store changes; node survives reload'
        known_bugs: [EDIT-1, FLOW-10, RUN-1]
      - id: F6.7
        route: /project/{id}/case/{caseId}
        action: 'drag node, pan, Ctrl+wheel zoom, "Fit to view", "Reset layout", search'
        api: []
        no_api_reason: session-only layout by design
        expects: {ui: 'zoom 25-300%; dragging never re-parents; data-testid tree-canvas-viewport / tree-canvas-stage present'}

  - id: F7
