  - id: F9
    title: Run assessment -> results
    actor: editor
    e2e: true
    preconditions: ['$P.base with FU and flows']
    steps:
      - id: F9.1a
        route: /project/{id}/case/{caseId}
        action: 'click toolbar "Run Assessment"'
        api:
          - method: POST
            path: '/api/cases/{caseId}/assessments'
            body: {run_name: Assessment}
            matrix: R23
            roles_allowed: [editor, adminm, owner]
            roles_denied: [anon, nonmem, viewer, padmin]
        db: {read: [case_table, project, component, flows, substances, driver_impact_factors, impact_categories], write: [assessment_runs, assessment_results]}
        expects:
          status: 201
          body: {success: true, run_id: '<id>', assessment: {status: completed}}
          db_after: "assessment_runs.status='completed', calculation_method 'CML 2001', region_code 'US', run_snapshot has flow_detail, goal_scope, data_quality"
          ui: 'URL /project/{id}/case/{caseId}/results'
        failures:
          - {when: 'caller is viewer', status: 403, ui: 'error shown (target)', now: 'modal/results treat as success (RUN-4)'}
          - {when: 'calculation_method "NOPE"', status: 400, now: '201 all-zero run', bug: RUN-6}
          - {when: 'engine throws', status: 500, db_after: "run row with status 'failed' and error_log", now: 'rolled back, nothing recorded', bug: RUN-3}
          - {when: 'no flows', status: 201, body_contains: 'No process step in this case has any input or output flows yet'}
          - {when: '31st run within an hour (target)', status: 429, bug: H5}
        known_bugs: [RUN-3, RUN-4, RUN-6, PROJ-5, L1]
      - id: F9.1c
        route: /project/{id}/case/{caseId}/results
        action: 'click "Re-run" -> dialog "Run Assessment": method "TRACI 2.1", region "Global"; click "Run assessment"'
        api:
          - {method: POST, path: '/api/cases/{caseId}/assessments', body: {run_name: 'Assessment <date>', calculation_method: 'TRACI 2.1', region_code: Global}, matrix: R23}
          - {method: GET, path: '/api/cases/{caseId}/assessments', matrix: R22}
        expects: {status: [201, 200], ui: 'new latest run shown; localStorage lcapix-run-prefs:<caseId> saved'}
        known_bugs: [RUN-5]
      - id: F9.2
        route: /project/{id}/case/{caseId}/results
        action: page load
        api:
          - {method: GET, path: '/api/cases/{caseId}', matrix: R19}
          - {method: GET, path: '/api/cases/{caseId}/components', matrix: R26}
          - {method: GET, path: '/api/projects/{projectId}', matrix: R09}
          - {method: GET, path: '/api/cases/{caseId}/assessments', matrix: R22}
        db: {read: [case_table, component, project, assessment_runs, assessment_results, impact_categories, account]}
        expects:
          status: 200
          ui: 'badge "LATEST RUN"; hero "TOTAL IMPACT · GLOBAL WARMING" value + unit; category cards; top contributors; "By life-cycle stage"; "Your write-up"; "Flow-level detail" (All/Inputs/Outputs); "Historical runs"'
        failures:
          - {when: 'stage total 1000', expect: 'shows 1,000', now: 'shows "1"', bug: RES-1}
          - {when: 'ozone-depletion value 4.2e-9', expect: 'non-zero display and storage', now: '0', bug: RUN-2}
          - {when: 'assessments GET 500', expect: 'error state', now: '"No assessments yet"', bug: RES-5}
        known_bugs: [RES-1, RES-3, RES-4, RES-5, RUN-2, STAGE-2]
      - id: F9.4
        route: /project/{id}/case/{caseId}/results
        action: 'after a second run with same method+region, read the delta pill'
        api: []
        no_api_reason: computed client-side from GET /assessments
        expects: {ui: '"↓/↑ X.X% vs last run" (same method and region only)', now: 'never renders'}
        known_bugs: [RES-2, RES-6]
      - id: F9.6
        route: '(API)'
        action: 'read one run; then edit/delete components and read again'
        api:
          - {method: GET, path: '/api/assessments/{runId}', params: {runId: $P.base.run}, matrix: R41, roles_allowed: [viewer, editor, adminm, owner], roles_denied: [anon, nonmem, padmin]}
        expects:
          status: 200
          invariant: 'totals, per-step rows, step names and stages identical before and after later edits/deletes'
          now: 'live JOIN component + ON DELETE CASCADE changes history'
        known_bugs: [RUN-1, RUN-8]

