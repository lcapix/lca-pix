    adminm:      {email: 'adminm+{run}@lcapix.test', fullName: 'Ada Admin',     company: 'LCAPIX Test'}
    nonmem:      {email: 'nonmem+{run}@lcapix.test', fullName: 'Nora Nonmember', company: 'LCAPIX Test'}
    userB:       {email: 'userb+{run}@lcapix.test',  fullName: 'Bea Tenant',    company: 'Other Co'}
    padmin:      {email: 'padmin+{run}@lcapix.test', fullName: 'Pat Platform',  company: 'LCAPIX Test', sql: "UPDATE account SET account_type='admin' WHERE email=?"}
