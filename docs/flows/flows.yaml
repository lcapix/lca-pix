        db: {write: [flows]}
        expects: {status: 200}
      - id: F7.8
        route: /project/{id}/case/{caseId}
        action: '"Don''t know what to add? Use the process library"; choose template; driver quantity 12; "Add these flows"'
        api:
          - {method: GET, path: /api/process-templates, matrix: R50, roles_allowed: [nonmem, viewer, editor, adminm, owner, padmin], roles_denied: [anon]}
