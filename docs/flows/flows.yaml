  handles:
    $P: {what: 'project "E2E Coffee Mug LCA" owned by owner; members editor/viewer/adminm', put: {functional_unit: '1 ceramic mug (350 ml), at the factory gate', system_boundary: cradle-to-gate, lcia_method: 'CML 2001', region_code: US}}
    $P.base: {what: 'base case "Standard Production"'}
    $P.base.product: {what: 'component product "Ceramic Coffee Mug (350ml)"'}
