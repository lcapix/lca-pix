        db: {write: [flows]}
        expects: {status: 201, ui: '"= 382.5 tkm"', db_after: 'transport_mass_kg 850, transport_distance_km 450'}
        failures:
          - {when: 'mass cleared or 0 after a calculation', expect: 'quantity cleared, save blocked', now: 'stale tkm saved', bug: TKM-1}
          - {when: 'quantity hand-edited after calculation', expect: 'read-only or recomputed', bug: TKM-2}
