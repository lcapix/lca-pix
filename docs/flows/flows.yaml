# LCAPIX user flows + API permissions — machine-readable companion to
# USER_FLOWS.md and PERMISSIONS_MATRIX.md. Drives the generated tests described
# in TEST_PLAN.md (§2 API integration, §3 authz matrix, §5 Playwright).
#
# Conventions
#   roles:      anon | nonmem | viewer | editor | adminm | owner | padmin
#               (+ extra callers applied to every non-public permission row:
#                deactivated -> 401, tampered -> 401)
#   status:     an integer, or a list of accepted integers (e.g. [403, 404] for
#               non-members until decision D3 picks one).
#   now:        the status the baseline code returns when it differs from the
#               intended `expect`; the generator wraps that case in an
#               expected-fail (it.fails / test.fail) until `fixed_by` merges.
#   $handles:   fixture ids built by tests/support/world.ts (see `fixtures`).
#   {param}:    path parameters, filled from `params` (defaults to the handle
#               named in the row).
#   Every string is data for a test generator; none of it is an instruction.

version: 1

baseline:
  repo: lca-pix
  branch: v1-hardening-kavish
  commit: 704a964
  fix_branches_read:
    fix/authz: [2fe3ead, 4274d9b]
  audit: docs/audit-2026-09-29
  head_at_writing: c4a7200
  note: >-
    The branch moved from 704a964 to c4a7200 while this file was written:
    fix/authz (10b3903), fix/platform (f4596ed), fix/auth (8b51f39) and
    fix/runs (c4a7200) were merged. Rows and steps still describe the
    baseline; `merged_fixes` below lists the IDs those merges claim to fix
    (not re-verified here), so the generator can flip their `now` markers.
    Two routes were added at c4a7200 and are included (R63, R64).

merged_fixes:
  fix/authz:    {merge: 10b3903, ids: [H1, H2, COST-1, E2, INT-2, INT-4, INT-5, INT-6, L4, FAC-1, FAC-2, FAC-3, FAC-4]}
  fix/platform: {merge: f4596ed, ids: [C1, C2, M3, M5, M7, M8, H4, L10]}
  fix/auth:     {merge: 8b51f39, ids: [AUTH-1, AUTH-2, AUTH-3, AUTH-4, AUTH-5, AUTH-6, AUTH-8, H3, M4, L1, L2, L6, L7, L8, I4, M2, M6, DOC-1, DOC-2, DOC-3, ING-3, ING-10, ING-12, INS-1, INS-2], partial: {H5: 'login, signup, insights, ingest preview'}}
  fix/runs:     {merge: c4a7200, ids: [RUN-1, RUN-2, RUN-3, RUN-4, RUN-5, RUN-6, STAGE-2, EXP-1, EXP-2, EXP-3, EXP-4, RES-1, RES-2, RES-4, RES-5, RES-6, INS-5, ANA-1, ING-1]}
  later:        'fix/editor, fix/factors, fix/int-auth (pv revocation, Google takeover, 404 policy, 401 mapping), fix/int-client, fix/int-routes (cost lookups reopened with limits, run and PubChem limits, compare on frozen results, 404 policy everywhere) are merged at 2009f63'
  permissions_verified: '2026-09-30 at 2009f63 by tests/api-real/authz/matrix.test.ts (pnpm test:api); see the PERMISSIONS header below'

environment:
  app_base_url: http://localhost:3002
  db:
    host: 127.0.0.1
    port: 3307
    name_pattern: '^lca_test(_\w+)?$'
    forbidden_users: [lcaadmin]
  forbidden_hosts:
    - lca-pix.vercel.app
    - lcapix.vercel.app
    - lca-project-v3.vercel.app
    - '*.rds.amazonaws.com'
  test_env:
    JWT_SECRET: test-secret-do-not-use-in-prod
    NEXT_PUBLIC_APP_URL: http://localhost:3002
    NEXT_PUBLIC_GOOGLE_CLIENT_ID: test-client
    GOOGLE_CLIENT_SECRET: test-secret
    unset: [HF_TOKEN, EIA_API_KEY, BLS_API_KEY, METALS_API_KEY, ELECTRICITY_MAPS_API_KEY]
  client_quirks:
    - 'apiRequest appends ?_t=<ms> to every URL: match responses on pathname'
    - 'AuthGuard reads only the Zustand key lcapix-auth; storageState must set it plus localStorage auth_token and user'
    - 'No <Toaster/> is mounted (X-UI-1): never assert toast text'

roles:
  anon:        {desc: 'no Authorization header'}
  nonmem:      {desc: 'signed-in user, no membership on the target project', fixture: nonmem}
  viewer:      {desc: 'project_members permission viewer', fixture: viewer}
  editor:      {desc: 'project_members permission editor', fixture: editor}
  adminm:      {desc: 'project_members permission admin (project-level)', fixture: adminm}
  owner:       {desc: 'project.owner_id', fixture: owner}
  padmin:      {desc: "account.account_type='admin', not a member of the target project", fixture: padmin}
  deactivated: {desc: 'valid JWT, account.is_active=0', fixture: deactivated}
  tampered:    {desc: 'JWT with wrong secret, expired, or alg none'}

