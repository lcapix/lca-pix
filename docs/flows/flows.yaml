    delta_pct: -38.4

# ---------------------------------------------------------------------------
# FLOWS
# ---------------------------------------------------------------------------
flows:

  - id: F1
    title: Sign up -> onboarding -> home
    actor: anon
    e2e: true
    preconditions: ['email not registered', 'empty localStorage']
    steps:
      - id: F1.1
        route: /auth/signup
        action: 'fill #fullName, #email, #password'
        api: []
        no_api_reason: form entry
        expects:
          ui: 'button "Create account" disabled until email and password are filled; client messages: "Email is required", "Please enter a valid email address", "Password must be at least 8 characters long", "Password must contain at least one number"'
      - id: F1.2
        route: /auth/signup
        action: 'click button "Create account"'
        api:
          - method: POST
            path: /api/auth/signup
            body: {username: '$user.fullName', email: '$user.email', password: '$user.password'}
            matrix: R01
            roles_allowed: [anon, nonmem, viewer, editor, adminm, owner, padmin]
            roles_denied: []
        db: {read: [account], write: [account]}
        expects:
          status: 201
          body: {success: true, user: {account_type: user}, token: '<jwt>'}
          ui: 'localStorage.auth_token and user set; lcapix-auth.isAuthenticated true; URL /auth/onboarding'
        failures:
          - {when: 'email already registered', status: 400, ui: '[role=alert] "Email already registered"', bug: L2}
          - {when: 'another account used the same typed full name', status: 400, ui: '[role=alert] "Username already taken"', bug: AUTH-4}
          - {when: 'password shorter than 8', status: 400}
          - {when: 'more than 3 signups per hour from one IP (target)', status: 429, bug: H5, fixed_by: fix/platform}
        known_bugs: [AUTH-4, AUTH-8, L2, H5]
      - id: F1.3
        route: /auth/onboarding
        action: page load
        api:
          - {method: GET, path: /api/auth/profile, matrix: R05, roles_allowed: [nonmem, viewer, editor, adminm, owner, padmin], roles_denied: [anon]}
        db: {read: [account]}
        expects:
          status: 200
          body: {profile: {needsOnboarding: true}}
          ui: 'h1 "Tell us a little about you."; Full name prefilled with the store name (= username)'
        known_bugs: [AUTH-7]
      - id: F1.4
        route: /auth/onboarding
        action: 'fill Full name*, Company / organization*, optional Role, Primary use case, Country; click "Continue to dashboard"'
        api:
          - method: PUT
            path: /api/auth/profile
            body: {fullName: '$user.fullName', company: '$user.company', role: 'Sustainability analyst', useCase: product, country: 'United States'}
            matrix: R06
            roles_allowed: [nonmem, viewer, editor, adminm, owner, padmin]
            roles_denied: [anon]
        db: {write: [account]}
        expects:
          status: 200
          db_after: 'account.full_name, company set; onboarded_at NOT NULL'
          ui: 'URL /home'
        failures:
          - {when: 'fullName or company empty', status: 400, ui: 'inline "Required."'}
          - {when: 'useCase not in product/facility/comparative/research/other', status: 400}
        known_bugs: [X-UI-1, AUTH-7]
      - id: F1.5
        route: /home
        action: page load
        api:
          - {method: GET, path: /api/auth/profile, matrix: R05, roles_allowed: [nonmem, viewer, editor, adminm, owner, padmin], roles_denied: [anon]}
          - {method: GET, path: /api/projects, matrix: R07, roles_allowed: [nonmem, viewer, editor, adminm, owner, padmin], roles_denied: [anon]}
          - {method: GET, path: /api/integrations/status, matrix: R54, roles_allowed: [nonmem, viewer, editor, adminm, owner, padmin], roles_denied: [anon]}
        db: {read: [account, project, project_members, permissions, case_table, component, substances, driver_impact_factors, cost_rates, integration_log]}
        expects:
          status: 200
          ui: '[data-tour=home-greeting] "Welcome back, <first name>."; tiles PROJECTS, CASES, FACTORS, SUBSTANCES; empty state "Start your first assessment." with buttons "Create your first project" and "Open the worked example"'

  - id: F2
    title: Log in / log out (email)
    actor: owner
    e2e: false
    preconditions: ['account exists and is active']
    steps:
      - id: F2.1
        route: /auth/login
        action: 'fill #email, #password; click "Log in"'
        api:
          - {method: POST, path: /api/auth/login, body: {email: '$user.email', password: '$user.password'}, matrix: R02, roles_allowed: [anon, nonmem, viewer, editor, adminm, owner, padmin], roles_denied: []}
        db: {read: [account]}
        expects: {status: 200, body: {success: true, token: '<jwt>'}, ui: 'URL /home'}
        failures:
          - {when: 'wrong password or unknown email', status: 401, ui: '[role=alert] "Invalid email or password"'}
          - {when: 'inactive account, wrong password', status: 401, ui: 'generic "Invalid email or password"', bug: AUTH-6, fixed_by: fix/auth}
          - {when: 'inactive account, correct password', status: 403, ui: '"Account is inactive. Please contact support."', now: '401 returned before the password check', bug: AUTH-6, fixed_by: fix/auth}
          - {when: '6th attempt within a minute for one IP+email (target)', status: 429, bug: H5, fixed_by: fix/platform}
          - {when: 'URL /auth/login?error=%25', ui: 'page must not crash', bug: AUTH-8}
        known_bugs: [AUTH-6, AUTH-8, L2, L8, H5]
      - id: F2.3
        route: '/home (any app page)'
        action: 'token expires or account deactivated'
        api:
          - {method: GET, path: /api/projects, caller: deactivated, matrix: R07}
        expects: {status: 401, ui: 'redirect /auth/login?error=session_expired; localStorage auth_token removed'}
        known_bugs: [AUTH-5, X-API-2]
      - id: F2.4
        route: 'top bar "Account menu" -> "Log out"'
        action: click
        api:
          - {method: POST, path: /api/auth/logout, matrix: R63, roles_allowed: [anon, nonmem, viewer, editor, adminm, owner, padmin], roles_denied: [], exists_since: c4a7200}
        baseline_note: 'no logout route at 704a964; the top bar cleared localStorage only (M4)'
        db: {}
        expects_api: {status: 200, set_cookie: 'auth_token and user_data with Max-Age=0'}
        expects:
          ui: 'URL /auth/login; localStorage auth_token and user removed; lcapix-auth logged out'
          target_ui: 'cookies auth_token/user_data expired; lcapix-projects cleared; visiting /auth/callback afterwards does not sign in'
        known_bugs: [M4, AUTH-3, AUTH-5]
      - id: F2.5
        route: /home
        action: navigate after logout
        api: []
        no_api_reason: client-side AuthGuard
        expects: {ui: 'redirect to /auth/login (no next param)'}

  - id: F3
    title: Google sign-in (target behaviour)
    actor: anon
    e2e: false
    preconditions: ['Google endpoints mocked (TEST_PLAN §7)']
    target_branch: fix/auth
    steps:
      - id: F3.1
        route: '/auth/login -> button "Continue with Google"'
        action: click
        api:
          - {method: GET, path: /api/auth/google, matrix: R03, roles_allowed: [anon, nonmem, viewer, editor, adminm, owner, padmin], roles_denied: []}
        expects:
          status: 302
          location_prefix: 'https://accounts.google.com/o/oauth2/v2/auth'
          location_params_required: [client_id, redirect_uri, response_type, scope, state]
          location_params_forbidden: [access_type, prompt]
          set_cookie: 'oauth state cookie: HttpOnly; SameSite=Lax; short Max-Age'
          now: 'no state param and no state cookie; access_type=offline and prompt=consent present'
        failures:
          - {when: 'client id or app URL not configured', status: 302, location: '/auth/login?error=google_not_configured'}
        known_bugs: [AUTH-1]
      - id: F3.3
        route: /api/auth/google?code&state
        action: 'Google redirects back'
        api:
          - {method: GET, path: '/api/auth/google?code=test-code&state={state}', matrix: R03b, roles_allowed: [anon], roles_denied: []}
        outbound_mocked: ['POST oauth2.googleapis.com/token', 'GET www.googleapis.com/oauth2/v2/userinfo']
        db: {read: [account], write: [account]}
        expects:
          status: 302
          location: '/auth/callback?next=/auth/onboarding (new or not onboarded) | /auth/callback?next=/home'
          set_cookie: 'session cookie HttpOnly (target, AUTH-3); state cookie cleared'
        cases:
          - {when: 'state missing or mismatched', status: 302, location: '/auth/login?error=oauth_state_mismatch', session_cookie: none, now: 'accepted', bug: AUTH-1}
          - {when: 'userinfo verified_email false', status: 302, location: '/auth/login?error=google_email_unverified', now: 'linked/created', bug: AUTH-2}
          - {when: 'email matches an existing password account', status: 302, location: '/auth/login?error=use_password_login', expect: 'never linked silently', now: 'signed into that account', bug: H3}
          - {when: 'email matches an inactive Google account', status: 302, location: '/auth/login?error=account_inactive', now: 'token issued', bug: AUTH-8}
          - {when: 'second user with same email local-part, different domain', expect: 'unique username derived; no 500', now: 'redirect error=server_error', bug: AUTH-4}
          - {when: 'Google returns ?error=access_denied', status: 302, location: '/auth/login?error=google_cancelled', now: 'error=access_denied'}
          - {when: 'token exchange fails', status: 302, location: '/auth/login?error=oauth_failed'}
          - {when: 'userinfo fails', status: 302, location: '/auth/login?error=userinfo_failed'}
        known_bugs: [AUTH-1, AUTH-2, AUTH-3, AUTH-4, AUTH-8, H3]
      - id: F3.4
        route: /auth/callback
        action: page load
        api:
          - {method: POST, path: /api/auth/google/session, matrix: R64, roles_allowed: ['anon with hand-off cookie'], roles_denied: ['any caller without the cookie', 'cross-site'], exists_since: c4a7200}
        baseline_note: 'at 704a964 the page read JS-readable auth_token/user_data cookies (7 days) and never cleared them'
        expects:
          status: 200
          body: {success: true, token: '<jwt>', user: '<user>'}
          set_cookie: 'auth_token cleared (Max-Age=0); a second call returns 401'
          ui: 'router.replace(next) where next is in [/home, /auth/onboarding], anything else -> /home; failure -> /auth/login?error=oauth_sync_failed'
        known_bugs: [M4, AUTH-3]

  - id: F4
    title: Create project (method, region, FU) and worked example
    actor: owner
    e2e: true
    preconditions: ['signed in and onboarded']
    steps:
      - id: F4.1
        route: /home
        action: 'click [data-tour=home-new-project] ("New project") or "Create your first project"'
        api: []
        no_api_reason: navigation
        expects: {ui: 'URL /project/new; h1 "Define an assessment."'}
      - id: F4.2
        route: /project/new
        action: 'fill #projectName, #projectDescription, #functionalUnit; select #boundary, #methodology, #region'
        api: []
        no_api_reason: form entry
        inputs:
          projectName: 'E2E Coffee Mug LCA {run}'
          projectDescription: '350ml ceramic coffee mug, end-to-end test'
          functionalUnit: '1 ceramic mug (350 ml), at the factory gate'
          boundary: cradle-to-gate
          methodology: 'CML 2001'
          region: US
        expects: {ui: 'button "Create Project" enabled only when the name is not blank'}
      - id: F4.3
        route: /project/new
        action: 'click "Create Project"'
        api:
          - method: POST
            path: /api/projects
            body: {project_name: '$inputs.projectName', description: '$inputs.projectDescription'}
            matrix: R08
            roles_allowed: [nonmem, viewer, editor, adminm, owner, padmin]
            roles_denied: [anon]
          - method: PUT
            path: '/api/projects/{projectId}'
            params: {projectId: '$created.project_id'}
            body: {functional_unit: '$inputs.functionalUnit', system_boundary: cradle-to-gate, goal_statement: '$inputs.projectDescription', lcia_method: 'CML 2001', region_code: US}
            matrix: R10
            roles_allowed: [adminm, owner]
            roles_denied: [anon, nonmem, viewer, editor, padmin]
        db: {read: [project, permissions], write: [project, project_members]}
        expects:
          status: [201, 200]
          db_after: "project row with owner_id=me, lcia_method 'CML 2001', region_code 'US', functional_unit set; one project_members row with permission owner"
          ui: 'URL /project/{id}/start; h1 "How do you want to start?"'
        failures:
          - {when: 'same owner already has the name (case-insensitive)', status: 409, ui: 'inline [role=alert] under the name'}
          - {when: 'PUT fails (e.g. 403/409)', expect: 'error surfaced, user stays on the form', now: 'swallowed; project runs as CML/Global', bug: PROJ-3}
        known_bugs: [PROJ-2, PROJ-3]
      - id: F4.5
        route: /project/{id}/start
        action: 'click "Start an empty case"'
        api:
          - {method: POST, path: '/api/projects/{projectId}/cases', params: {projectId: $P}, body: {case_name: 'Base case', case_type: base, description: 'Built by hand'}, matrix: R13, roles_allowed: [editor, adminm, owner], roles_denied: [anon, nonmem, viewer, padmin]}
        db: {write: [case_table]}
        expects: {status: 201, ui: 'URL /project/{id}/case/{caseId}?learn=1; lesson rail and Reference pane open'}
        failures:
          - {when: 'case name exists in project', status: 409, ui: 'toast + navigate to /project/{id}'}
      - id: F4.6
        route: /project/{id}
        action: page load
        api:
          - {method: GET, path: '/api/projects/{projectId}', matrix: R09, roles_allowed: [viewer, editor, adminm, owner], roles_denied: [anon, nonmem, padmin]}
          - {method: GET, path: '/api/projects/{projectId}/cases', matrix: R12, roles_allowed: [viewer, editor, adminm, owner], roles_denied: [anon, nonmem, padmin]}
        db: {read: [project, project_members, case_table, component, flows, assessment_runs]}
        expects:
          status: 200
          ui: 'h1[data-tour=project-header]; buttons Analytics, Compare Cases (disabled < 2 cases), Class, Import Data, Add Case [data-tour=project-add-case], Delete; Open editor [data-tour=project-open-editor]'
        known_bugs: [PROJ-4, PROJ-5, PROJ-6]
      - id: F4b.1
        route: /home
        precondition: 'user has 0 projects'
        action: 'click "Open the worked example"'
        api:
          - {method: POST, path: /api/example-project, matrix: R50b, roles_allowed: [nonmem, viewer, editor, adminm, owner, padmin], roles_denied: [anon]}
        db: {read: [project, substances], write: [project, case_table, component, flows]}
        expects:
          status: 200
          body: {success: true, project_id: '<id>', case_id: '<id>'}
          db_after: "project 'Example: painted steel bracket' lcia_method 'TRACI 2.1' region_code 'US'; project.functional_unit = '1 painted steel bracket, at the factory gate'; case reference_flow 1"
          ui: 'URL /project/{id}'
          now: 'project.functional_unit NULL (written to case_table, error swallowed) -> Run disabled'
        failures:
          - {when: 'called again', status: 200, body: {existed: true}}
        known_bugs: [PROJ-1, PROJ-2]
      - id: F4b.2
        route: /project/{id}/case/{caseId}
        action: 'open the example case'
        api: []
        no_api_reason: see F5/F9
        expects: {ui: 'button "Run Assessment" enabled', now: 'disabled, title "Set the functional unit (Goal & scope) before running"'}
        known_bugs: [PROJ-1]

  - id: F5
    title: Goal & scope (ISO phase 1)
    actor: owner
    e2e: true
    preconditions: ['$P with a base case', 'migrations 014 and 018 applied']
    steps:
      - id: F5.1
        route: /project/{id}/case/{caseId}
        action: 'page load; card [data-tour=case-goal-scope]'
        api:
          - {method: GET, path: '/api/projects/{projectId}', matrix: R09}
          - {method: GET, path: '/api/cases/{caseId}', matrix: R19, roles_allowed: [viewer, editor, adminm, owner], roles_denied: [anon, nonmem, padmin]}
        db: {read: [project, case_table]}
        expects: {status: 200, ui: 'collapsed summary or red "Functional unit not set: needed before a run"; toggle "Set it"/"Edit"/"Close"'}
      - id: F5.3
        route: /project/{id}/case/{caseId}
        action: 'click "Set it"; fill Functional unit, System boundary, Reference flow (+unit), Data basis, Goal, Exclusions & cut-off; click "Save"'
        api:
          - method: PUT
            path: '/api/projects/{projectId}'
